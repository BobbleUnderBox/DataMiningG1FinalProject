# ============================================================
# BNPL 信用風險分類專案 - 設定檔案（簡化版本）
# ============================================================
# 此設定檔案支援多使用者、多平台使用
# 僅包含資料前處理與 EDA 相關設定
# 後續檢定、採礦、模型等由其他貢獻者決策實作

# ============================================================
# 1. 資料路徑設定
# ============================================================
data:
  # 原始資料目錄（存放從 Kaggle 或其他來源下載的資料）
  raw_dir: "data/raw"
  
  # 中間資料目錄（存放 EDA、特徵工程後的過渡資料）
  interim_dir: "data/interim"
  
  # 處理完成的資料目錄（立即可用於建模的特徵資料）
  processed_dir: "data/processed"
  
  # 完整的原始資料集檔案名
  raw_filename: "Buy_Now_Pay_Later_BNPL_CreditRisk_Dataset.csv"

# ============================================================
# 2. Kaggle API 設定
# ============================================================
kaggle:
  # 是否啟用 Kaggle 資料集下載
  # 選項: true (自動下載) | false (使用本地快取)
  enable_download: false
  
  # Kaggle API 身份驗證方法
  # 選項: 
  #   - "env_vars": 使用系統環境變數 (KAGGLE_USERNAME, KAGGLE_KEY)
  #   - "credentials_file": 使用官方 kaggle.json 檔案
  #   - "custom_token_file": 使用自定義純文字 token 檔案 (設定為 KAGGLE_API_TOKEN)
  auth_method: "env_vars"
  
  # Kaggle 資料集識別碼
  dataset_id: "shree0910/buy-now-and-pay-later-fintech-ml-dataset"
  
  # 身份驗證檔案位置
  # 若為 "credentials_file": 通常是 ~/.kaggle/kaggle.json
  # 若為 "custom_token_file": 您自定義的路徑，例如 C:\Users\User\.kaggle\access_token
  credentials_path: "~/.kaggle/kaggle.json"
  
  # Kaggle 使用者名稱和 API Key（僅當 auth_method 為 "env_vars" 時使用）
  # ⚠️  建議：在環境變數中設置 KAGGLE_USERNAME 和 KAGGLE_KEY，而不是在此檔案中
  # 可選擇在此處設置預設值，或留空讓程式從環境變數讀取
  username: ""  # 留空則從環境變數 KAGGLE_USERNAME 讀取
  api_key: ""   # 留空則從環境變數 KAGGLE_KEY 讀取

# ============================================================
# 3. 日誌記錄設定
# ============================================================
logging:
  # 日誌記錄級別：DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # 日誌格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 專案元資料（供參考）
  version: "1.1.0"
  description: "Buy-Now-Pay-Later (BNPL) 信用風險分類與預測"
  data_source: "Kaggle - BNPL Credit Risk Dataset"
  created_date: "2026-05-06"
  maintainers:
    - name: "Data Science Team"
